name: Build

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install official wasm-pack 0.14.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wasm-pack.tar.gz"
          Invoke-WebRequest "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-pc-windows-msvc.tar.gz" -OutFile $archive
          tar -xzf $archive -C $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "wasm-pack-v0.14.0-x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install and Build
        shell: sh
        run: |
          npm ci
          cargo test --release
          npm run build
          npm run test:engine
          npm run check
          cp dist/index.html dist/404.html

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
